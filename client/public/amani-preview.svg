<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="480" height="300" fill="#0a1628"/>

  <!-- Subtle grid -->
  <line x1="0" y1="0" x2="480" y2="300" stroke="#0d9488" stroke-width="0.3" opacity="0.15"/>
  <line x1="480" y1="0" x2="0" y2="300" stroke="#0d9488" stroke-width="0.3" opacity="0.15"/>
  <circle cx="240" cy="150" r="120" fill="none" stroke="#0d9488" stroke-width="0.5" opacity="0.12"/>
  <circle cx="240" cy="150" r="80" fill="none" stroke="#0d9488" stroke-width="0.5" opacity="0.1"/>

  <!-- Location pin / water drop icon -->
  <!-- Drop shape: circle top + pointed bottom -->
  <path d="M240 80 C240 80 210 115 210 135 C210 152 224 165 240 165 C256 165 270 152 270 135 C270 115 240 80 240 80 Z" fill="#0d9488" opacity="0.9"/>
  <!-- Inner circle (water) -->
  <circle cx="240" cy="138" r="14" fill="#0a1628" opacity="0.6"/>
  <!-- AR ring around pin -->
  <circle cx="240" cy="150" r="45" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Hazard dots around the pin -->
  <circle cx="180" cy="130" r="5" fill="#dc2626" opacity="0.7"/>
  <circle cx="300" cy="120" r="4" fill="#d97706" opacity="0.7"/>
  <circle cx="195" cy="175" r="4" fill="#0d9488" opacity="0.7"/>
  <circle cx="295" cy="168" r="5" fill="#dc2626" opacity="0.6"/>

  <!-- AMANI wordmark -->
  <text x="240" y="208" text-anchor="middle" fill="#f0fdf4" font-size="36" font-weight="700" letter-spacing="8">AMANI</text>

  <!-- Subtitle -->
  <text x="240" y="232" text-anchor="middle" fill="#5eead4" font-size="11" letter-spacing="1">AI-POWERED WASH HAZARD MAPPING</text>

  <!-- Badge -->
  <rect x="115" y="252" width="250" height="24" rx="12" fill="#0d9488" opacity="0.15" stroke="#0d9488" stroke-width="1" opacity="0.4"/>
  <text x="240" y="269" text-anchor="middle" fill="#5eead4" font-size="10">★  Stanford Healthcare Design Challenge Finalist</text>
</svg>
