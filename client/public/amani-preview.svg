<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="480" height="340" fill="#0f172a"/>

  <!-- Map background grid -->
  <rect x="20" y="60" width="440" height="220" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Map grid lines -->
  <line x1="20" y1="100" x2="460" y2="100" stroke="#334155" stroke-width="0.5"/>
  <line x1="20" y1="140" x2="460" y2="140" stroke="#334155" stroke-width="0.5"/>
  <line x1="20" y1="180" x2="460" y2="180" stroke="#334155" stroke-width="0.5"/>
  <line x1="20" y1="220" x2="460" y2="220" stroke="#334155" stroke-width="0.5"/>
  <line x1="100" y1="60" x2="100" y2="280" stroke="#334155" stroke-width="0.5"/>
  <line x1="180" y1="60" x2="180" y2="280" stroke="#334155" stroke-width="0.5"/>
  <line x1="260" y1="60" x2="260" y2="280" stroke="#334155" stroke-width="0.5"/>
  <line x1="340" y1="60" x2="340" y2="280" stroke="#334155" stroke-width="0.5"/>
  <line x1="420" y1="60" x2="420" y2="280" stroke="#334155" stroke-width="0.5"/>

  <!-- Location pins (hazard reports) -->
  <!-- Pin 1 - red hazard -->
  <circle cx="140" cy="145" r="10" fill="#dc2626" opacity="0.8"/>
  <text x="140" y="149" text-anchor="middle" fill="white" font-size="10">!</text>
  <line x1="140" y1="155" x2="140" y2="168" stroke="#dc2626" stroke-width="2"/>

  <!-- Pin 2 - orange warning -->
  <circle cx="230" cy="110" r="8" fill="#d97706" opacity="0.8"/>
  <text x="230" y="114" text-anchor="middle" fill="white" font-size="9">!</text>
  <line x1="230" y1="118" x2="230" y2="128" stroke="#d97706" stroke-width="1.5"/>

  <!-- Pin 3 - teal safe -->
  <circle cx="310" cy="170" r="8" fill="#0d9488" opacity="0.8"/>
  <text x="310" y="174" text-anchor="middle" fill="white" font-size="10">✓</text>
  <line x1="310" y1="178" x2="310" y2="190" stroke="#0d9488" stroke-width="1.5"/>

  <!-- Pin 4 - yellow -->
  <circle cx="380" cy="120" r="7" fill="#ca8a04" opacity="0.8"/>
  <text x="380" y="124" text-anchor="middle" fill="white" font-size="8">!</text>
  <line x1="380" y1="127" x2="380" y2="136" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Pin 5 -->
  <circle cx="80" cy="200" r="7" fill="#0d9488" opacity="0.8"/>
  <text x="80" y="204" text-anchor="middle" fill="white" font-size="10">✓</text>
  <line x1="80" y1="207" x2="80" y2="216" stroke="#0d9488" stroke-width="1.5"/>

  <!-- Heatmap overlay -->
  <circle cx="140" cy="155" r="30" fill="#dc2626" opacity="0.08"/>
  <circle cx="140" cy="155" r="20" fill="#dc2626" opacity="0.08"/>
  <circle cx="230" cy="120" r="24" fill="#d97706" opacity="0.08"/>

  <!-- Offline indicator -->
  <rect x="30" y="250" width="90" height="22" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="75" y="265" text-anchor="middle" fill="#93c5fd" font-size="8">Offline-first</text>

  <!-- Edge AI indicator -->
  <rect x="135" y="250" width="80" height="22" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="175" y="265" text-anchor="middle" fill="#86efac" font-size="8">Edge AI CV</text>

  <!-- Privacy indicator -->
  <rect x="228" y="250" width="80" height="22" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="268" y="265" text-anchor="middle" fill="#94a3b8" font-size="8">Privacy-first</text>

  <!-- React Native -->
  <rect x="322" y="250" width="80" height="22" rx="4" fill="#1a1a3e" stroke="#818cf8" stroke-width="1"/>
  <text x="362" y="265" text-anchor="middle" fill="#a5b4fc" font-size="8">React Native</text>

  <!-- Title -->
  <text x="240" y="36" text-anchor="middle" fill="#0d9488" font-size="13" font-weight="bold">AMANI — Health Mapping System</text>
  <text x="240" y="52" text-anchor="middle" fill="#f59e0b" font-size="9">★ Stanford Healthcare Design Challenge Finalist</text>
</svg>
