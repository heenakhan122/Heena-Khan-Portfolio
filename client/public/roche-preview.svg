<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="300" fill="#0a1a3a"/>

  <!-- Roche blue hexagon logo (simplified) -->
  <polygon points="240,70 278,92 278,136 240,158 202,136 202,92" fill="#0066cc" opacity="0.9"/>
  <polygon points="240,82 268,98 268,130 240,146 212,130 212,98" fill="#004fa3" opacity="0.7"/>
  <!-- White R in hexagon -->
  <text x="240" y="132" text-anchor="middle" fill="white" font-size="42" font-weight="800" font-family="Arial, sans-serif">R</text>

  <!-- ROCHE wordmark -->
  <text x="240" y="186" text-anchor="middle" fill="#e0eaff" font-size="22" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="6">ROCHE</text>
  <text x="240" y="206" text-anchor="middle" fill="#7fa8d8" font-size="10" font-family="system-ui, sans-serif" letter-spacing="2">/ GENENTECH</text>

  <!-- Divider -->
  <line x1="140" y1="220" x2="340" y2="220" stroke="#0066cc" stroke-width="0.5" opacity="0.4"/>

  <!-- Project name -->
  <text x="240" y="244" text-anchor="middle" fill="#f0f8ff" font-size="14" font-weight="600" font-family="system-ui, sans-serif">PCR Assay Data Platform</text>
  <text x="240" y="264" text-anchor="middle" fill="#7fa8d8" font-size="10" font-family="system-ui, sans-serif">PostgreSQL · Django · React · AI Agent · ETL</text>

  <!-- Intern badge -->
  <rect x="158" y="276" width="164" height="16" rx="8" fill="#0066cc" fill-opacity="0.15" stroke="#0066cc" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="240" y="288" text-anchor="middle" fill="#7fa8d8" font-size="9" font-family="system-ui, sans-serif">SWE Intern · Data Infrastructure &amp; Full Stack</text>
</svg>
