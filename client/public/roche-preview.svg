<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="480" height="340" fill="#0f172a"/>

  <!-- Grid lines -->
  <line x1="0" y1="60" x2="480" y2="60" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="120" x2="480" y2="120" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="180" x2="480" y2="180" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="240" x2="480" y2="240" stroke="#1e293b" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="340" stroke="#1e293b" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="340" stroke="#1e293b" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="340" stroke="#1e293b" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="340" stroke="#1e293b" stroke-width="1"/>

  <!-- ETL Arrow pipeline -->
  <!-- Excel box -->
  <rect x="20" y="120" width="60" height="40" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1"/>
  <text x="50" y="144" text-anchor="middle" fill="#86efac" font-size="9">Excel ETL</text>
  <!-- arrow -->
  <line x1="80" y1="140" x2="110" y2="140" stroke="#0d9488" stroke-width="1.5"/>
  <polygon points="110,136 118,140 110,144" fill="#0d9488"/>

  <!-- DB cylinder -->
  <ellipse cx="150" cy="120" rx="28" ry="8" fill="#0d9488" opacity="0.3" stroke="#0d9488" stroke-width="1"/>
  <rect x="122" y="120" width="56" height="40" fill="#0d9488" opacity="0.15" stroke="#0d9488" stroke-width="1"/>
  <ellipse cx="150" cy="160" rx="28" ry="8" fill="#0d9488" opacity="0.3" stroke="#0d9488" stroke-width="1"/>
  <text x="150" y="143" text-anchor="middle" fill="#5eead4" font-size="9">PostgreSQL</text>

  <!-- arrow -->
  <line x1="178" y1="140" x2="210" y2="140" stroke="#0d9488" stroke-width="1.5"/>
  <polygon points="210,136 218,140 210,144" fill="#0d9488"/>

  <!-- AI Agent box -->
  <rect x="218" y="118" width="72" height="44" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="254" y="136" text-anchor="middle" fill="#93c5fd" font-size="8">AI Agent</text>
  <text x="254" y="149" text-anchor="middle" fill="#60a5fa" font-size="7">NL → SQL</text>
  <text x="254" y="158" text-anchor="middle" fill="#60a5fa" font-size="7">live queries</text>

  <!-- arrow -->
  <line x1="290" y1="140" x2="322" y2="140" stroke="#0d9488" stroke-width="1.5"/>
  <polygon points="322,136 330,140 322,144" fill="#0d9488"/>

  <!-- React UI box -->
  <rect x="330" y="118" width="70" height="44" rx="6" fill="#1a1a3e" stroke="#818cf8" stroke-width="1.5"/>
  <text x="365" y="136" text-anchor="middle" fill="#a5b4fc" font-size="8">React UI</text>
  <text x="365" y="149" text-anchor="middle" fill="#818cf8" font-size="7">PCR curves</text>
  <text x="365" y="158" text-anchor="middle" fill="#818cf8" font-size="7">chat interface</text>

  <!-- Drift detection box -->
  <rect x="90" y="210" width="120" height="36" rx="4" fill="#7c1d1d" stroke="#f87171" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="150" y="226" text-anchor="middle" fill="#fca5a5" font-size="8">Drift Detection</text>
  <text x="150" y="238" text-anchor="middle" fill="#f87171" font-size="7">schema + distribution</text>
  <!-- vertical arrow from drift to pipeline -->
  <line x1="150" y1="168" x2="150" y2="208" stroke="#f87171" stroke-width="1" stroke-dasharray="3,2"/>
  <polygon points="146,208 150,216 154,208" fill="#f87171"/>

  <!-- Docker badge -->
  <rect x="330" y="210" width="80" height="28" rx="4" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="370" y="222" text-anchor="middle" fill="#7dd3fc" font-size="8">Docker + CI/CD</text>
  <text x="370" y="232" text-anchor="middle" fill="#38bdf8" font-size="7">automated deploy</text>

  <!-- Title -->
  <text x="240" y="36" text-anchor="middle" fill="#0d9488" font-size="13" font-weight="bold">Roche PCR Assay Platform</text>
  <text x="240" y="52" text-anchor="middle" fill="#64748b" font-size="9">PostgreSQL · Django · React · AI Agent · Docker</text>

  <!-- Bottom label -->
  <text x="240" y="310" text-anchor="middle" fill="#334155" font-size="8">25+ tables · multi-column indexing · ETL audit log · NL-to-SQL agent</text>
</svg>
