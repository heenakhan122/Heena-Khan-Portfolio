<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="480" height="300" fill="#0a1628"/>

  <!-- Subtle radial glow -->
  <circle cx="240" cy="130" r="100" fill="#0d9488" opacity="0.04"/>

  <!-- Hexagon (molecular / Roche nod) -->
  <polygon points="240,62 286,87 286,137 240,162 194,137 194,87" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.8"/>
  <!-- Inner hexagon -->
  <polygon points="240,80 272,98 272,132 240,150 208,132 208,98" fill="#0d9488" opacity="0.08"/>

  <!-- PCR amplification curve inside hexagon -->
  <path d="M210 130 Q218 130 222 128 Q226 126 228 118 Q230 108 232 106 Q234 104 236 112 Q238 120 240 118 Q242 116 244 108 Q246 100 248 98 Q250 96 252 105 Q254 114 256 112 Q258 110 260 120 Q262 128 266 130 Q268 130 270 130"
        fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>

  <!-- DNA dots along curve (simplified) -->
  <circle cx="232" cy="106" r="2.5" fill="#5eead4"/>
  <circle cx="240" cy="118" r="2.5" fill="#5eead4"/>
  <circle cx="248" cy="98" r="2.5" fill="#5eead4"/>
  <circle cx="256" cy="112" r="2.5" fill="#5eead4"/>

  <!-- Roche wordmark -->
  <text x="240" y="200" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="3" font-weight="400">ROCHE / GENENTECH</text>

  <!-- Project name -->
  <text x="240" y="228" text-anchor="middle" fill="#f0fdf4" font-size="22" font-weight="700" letter-spacing="1">PCR Assay Platform</text>

  <!-- Tags row -->
  <text x="240" y="255" text-anchor="middle" fill="#5eead4" font-size="10" letter-spacing="0.5">PostgreSQL · Django · React · AI Agent · ETL</text>

  <!-- Internship badge -->
  <rect x="145" y="268" width="190" height="20" rx="10" fill="#0d9488" opacity="0.12" stroke="#0d9488" stroke-width="0.8"/>
  <text x="240" y="282" text-anchor="middle" fill="#5eead4" font-size="9.5">SWE Intern  ·  Data Infrastructure &amp; Full Stack</text>
</svg>
